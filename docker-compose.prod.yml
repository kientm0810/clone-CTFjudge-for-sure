x-backend-common: &backend-common
  image: ctfjudge-backend:prod
  build:
    context: ./backend
  env_file:
    - path: ${PROD_ENV_FILE:-.env.prod}
      required: true
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ctfjudge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ctfjudge}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctfjudge}
      POSTGRES_USER: ${POSTGRES_USER:-ctfjudge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctfjudge} -d ${POSTGRES_DB:-ctfjudge}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    <<: *backend-common
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - upload_data:/data/uploads
      - artifact_data:/data/artifacts
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend-common
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --concurrency=1
    volumes:
      - upload_data:/data/uploads
      - artifact_data:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ctfjudge-web:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api
    environment:
      NEXT_PUBLIC_API_URL: /api
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  upload_data:
  artifact_data:
  caddy_data:
  caddy_config:
